name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.11"
          enable-cache: false
      - name: Create clean backend environment
        run: uv venv .venv --python 3.11
      - name: Install locked backend dependencies
        run: uv pip sync --python .venv/bin/python backend/requirements-lock.txt
      - name: Validate backend dependencies
        run: uv pip check --python .venv/bin/python
      - name: Run targeted backend tests
        run: .venv/bin/python -m pytest tests -q
      - name: Verify scoped root collection
        run: .venv/bin/python -m pytest -q
      - name: Verify reproducible Python lock
        run: |
          uv pip compile backend/requirements.txt --python-version 3.11 --universal --generate-hashes --output-file backend/requirements-lock.txt
          git diff --exit-code -- backend/requirements-lock.txt

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test
      - name: Run frontend lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
